<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f7f7f2" />
    <meta name="format-detection" content="telephone=no" />
    <meta
      name="description"
      content="Hadirku Lecarassa — absensi kehadiran karyawan"
    />
    <title>Hadirku Lecarassa</title>
    <script>
      try {
        if (localStorage.getItem("hadirku-theme") === "dark") {
          document.documentElement.classList.add("dark");
        }
      } catch (error) {
        /* localStorage may be unavailable */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; }
  body {
    font-family: "PJS", "Segoe UI", sans-serif;
    background:
      radial-gradient(120% 120% at 83% 32%, rgba(228,242,34,0.18) 0%, rgba(228,242,34,0.03) 38%, transparent 62%),
      radial-gradient(80% 100% at 8% 110%, rgba(228,242,34,0.10) 0%, transparent 55%),
      linear-gradient(135deg, #0d1008 0%, #14180d 48%, #0b0d07 100%);
    color: #f4f6ec;
    position: relative;
  }
  .grid {
    position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 42px 42px;
    mask-image: linear-gradient(90deg, rgba(0,0,0,0.8), transparent 72%);
  }
  .content { position: absolute; left: 64px; top: 54px; width: 610px; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand img { width: 54px; height: 54px; border-radius: 15px; box-shadow: 0 10px 30px rgba(228,242,34,0.18); }
  .wordmark { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
  .wordmark span { font-weight: 300; color: #c9cec0; }
  .eyebrow { margin-top: 34px; display: inline-flex; align-items: center; gap: 8px; border: 1px solid rgba(228,242,34,0.35); background: rgba(228,242,34,0.08); color: #e4f222; border-radius: 999px; padding: 7px 13px; font-size: 12px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #e4f222; box-shadow: 0 0 10px rgba(228,242,34,0.9); }
  h1 { margin: 18px 0 0; font-size: 52px; line-height: 1.02; letter-spacing: -2.2px; font-weight: 800; }
  h1 em { font-style: normal; color: #e4f222; }
  p { margin: 17px 0 0; max-width: 530px; color: #b9bfae; font-size: 18px; line-height: 1.5; }
  .tags { display: flex; gap: 9px; margin-top: 22px; flex-wrap: wrap; }
  .tag { border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.045); color: #e6e9dd; border-radius: 8px; padding: 8px 11px; font-size: 12px; font-weight: 600; }
  .phone-wrap { position: absolute; right: 64px; top: 44px; width: 228px; height: 405px; transform: rotate(5deg); }
  .glow { position: absolute; inset: -36px -30px; background: radial-gradient(circle at 55% 45%, rgba(228,242,34,0.30), transparent 64%); filter: blur(14px); }
  .phone { position: relative; width: 228px; height: 405px; border-radius: 34px; background: #090b06; border: 7px solid #252a1b; box-shadow: 0 30px 60px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(255,255,255,0.08); overflow: hidden; }
  .phone .notch { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: 72px; height: 15px; border-radius: 10px; background: #090b06; z-index: 3; }
  .phone img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; }
  .caption { position: absolute; right: 62px; bottom: 30px; font-size: 11px; color: #8f9685; letter-spacing: 0.7px; text-transform: uppercase; }
</style>
